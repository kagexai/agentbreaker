# These are challenges that are public-by-design (open registration, meant to be
# attacked), so candidates from here are marked authorized_by_design: true.
# Add new entries as challenges appear -- the curated source reads this file.
#
# Fields:
#   name           display name
#   url            challenge URL (the handle used for dedup)
#   category       prompt_injection | jailbreak | guardrail | data_exfiltration
#   provider       suggested AgentBreaker provider (script/http/browser)
#   description    one-liner
#   tags           free-form labels
#   platform_match (optional) true if platforms.yaml already knows how to wire it

