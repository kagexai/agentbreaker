<?xml version="1.0" encoding="UTF-8"?>
<!-- Flat fills on purpose. The previous version set .mark from a <style>
     block driven by prefers-color-scheme; Google rasterises favicons
     server-side with no colour-scheme context, so those fills were
     unreliable exactly where it mattered. A black mark on a white tile
     reads on light and dark chrome alike, and needs no CSS to do it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" rx="170" fill="#ffffff"/>
  <g transform="translate(500,500) scale(0.76) translate(-500,-500)">
    <polygon fill="#111214" points="965 722.46 965 966.26 229.18 420.88 229.18 579.23 305.46 522.86 469.6 644.19 34.06 966.28 34.06 33.84 965 722.46"/>
    <polygon fill="#fb2c36" points="964.97 33.84 964.97 277.34 695 477 530.92 355.67 964.97 33.84"/>
  </g>
</svg>
